# Sozvon/docker-compose.dev.yml

networks:
  sozvon-net:
    driver: bridge

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  pg_auth:
  pg_user:
  pg_chat:

services:

  # ════════════════════════════════════════════════════════════════════════════
  # PostgreSQL — отдельный инстанс для каждого сервиса
  # ════════════════════════════════════════════════════════════════════════════
  auth-db:
    image: postgres:18.4-alpine
    container_name: auth-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       authdb
      POSTGRES_USER:     user
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-secret}
    volumes:
      - pg_auth:/var/lib/postgresql
    networks:
      - sozvon-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d authdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-db:
    image: postgres:18.4-alpine
    container_name: user-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       userdb
      POSTGRES_USER:     user
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:-secret}
    volumes:
      - pg_user:/var/lib/postgresql
    networks:
      - sozvon-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d userdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  chat-db:
    image: postgres:18.4-alpine
    container_name: chat-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       chatdb
      POSTGRES_USER:     user
      POSTGRES_PASSWORD: ${CHAT_DB_PASSWORD:-secret}
    volumes:
      - pg_chat:/var/lib/postgresql
    networks:
      - sozvon-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d chatdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ════════════════════════════════════════════════════════════════════════════
  # Go-сервисы
  # ════════════════════════════════════════════════════════════════════════════

  voice-service:
    build:
      context: ./Services/Voice_Service
      dockerfile: Dockerfile
    container_name: voice-service
    restart: unless-stopped
    environment:
      # WebRTC STUN/TURN — переопределяется в .env при необходимости
      STUN_SERVERS: ${STUN_SERVERS:-stun:stun.l.google.com:19302}
      TURN_SERVER:  ${TURN_SERVER:-}
      TURN_USER:    ${TURN_USER:-}
      TURN_PASS:    ${TURN_PASS:-}
      PUBLIC_IP:    ${GLOBAL_IP:-}
      APP_PORT:     8085
      UDP_PORT_MIN: 10000
      UDP_PORT_MAX: 10200
    ports:
      - "8085:8085"
      - "10000-10200:10000-10200/udp"
    networks:
      - sozvon-net

  user-service:
    build:
      context: ./Services/User_Service
      dockerfile: Dockerfile
    container_name: user-service
    restart: unless-stopped
    environment:
      DB_HOST:     user-db
      DB_PORT:     5432
      DB_NAME:     userdb
      DB_USER:     user
      DB_PASSWORD: ${USER_DB_PASSWORD:-secret}
      APP_PORT:    8083
    ports:
      - "8083:8083"
    depends_on:
      user-db:
        condition: service_healthy
    networks:
      - sozvon-net

  chat-service:
    build:
      context: ./Services/Chat_Service
      dockerfile: Dockerfile
    container_name: chat-service
    restart: unless-stopped
    environment:
      DB_HOST:     chat-db
      DB_PORT:     5432
      DB_NAME:     chatdb
      DB_USER:     user
      DB_PASSWORD: ${CHAT_DB_PASSWORD:-secret}
      APP_PORT:    8084
    ports:
      - "8084:8084"
    depends_on:
      chat-db:
        condition: service_healthy
    networks:
      - sozvon-net

  auth-service:
    build:
      context: ./Services/Auth_Service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: unless-stopped
    environment:
      DB_HOST:     auth-db
      DB_PORT:     5432
      DB_NAME:     authdb
      DB_USER:     user
      DB_PASSWORD: ${AUTH_DB_PASSWORD:-secret}
      JWT_SECRET:  ${JWT_SECRET:-changeme}
      APP_PORT:    8082
    ports:
      - "8082:8082"
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - sozvon-net
      
  gateway:
    build:
      context: ./Gateway
      dockerfile: Dockerfile
    container_name: gateway
    ports:
      - "8080:8080"
    environment:
      SERVER_ADDRESS:    ":8080"
      AUTH_SERVICE_URL:  "http://auth-service:8082"
      USER_SERVICE_URL:  "http://user-service:8083"
      CHAT_SERVICE_URL:  "http://chat-service:8084"
      VOICE_SERVICE_URL: "http://voice-service:8085"
      JWT_SECRET_KEY:    ${JWT_SECRET:-changeme}
    networks:
      - sozvon-net

  # ════════════════════════════════════════════════════════════════════════════
  # React-клиент (development mode)
  # ════════════════════════════════════════════════════════════════════════════
  
  client:
      build:
        context: ./sozvon-client
        dockerfile: Dockerfile.dev
      container_name: sozvon-client
      restart: unless-stopped
      ports:
        - "3000:3000"
      networks:
        - sozvon-net
      volumes:
        - ./sozvon-client:/app          # Монтируем исходники
        - /app/node_modules             # Сохраняем node_modules в контейнере
      environment:
        - VITE_API_URL=http://${LOCAL_IP:-localhost}:8080/api
        - VITE_WS_URL=ws://${LOCAL_IP:-localhost}:8080/ws