# Sozvon\docker-compose.prod.yml

networks:
  sozvon-net:
    driver: bridge

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  pg_auth:
  pg_user:
  pg_chat:

services:

  # ════════════════════════════════════════════════════════════════════════════
  # PostgreSQL — отдельный инстанс для каждого сервиса
  # ════════════════════════════════════════════════════════════════════════════
  auth-db:
    image: postgres:18.4-alpine
    container_name: auth-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       authdb
      POSTGRES_USER:     user
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-secret}
    volumes:
      - pg_auth:/var/lib/postgresql
    networks:
      - sozvon-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d authdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-db:
    image: postgres:18.4-alpine
    container_name: user-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       userdb
      POSTGRES_USER:     user
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:-secret}
    volumes:
      - pg_user:/var/lib/postgresql
    networks:
      - sozvon-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d userdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  chat-db:
    image: postgres:18.4-alpine
    container_name: chat-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       chatdb
      POSTGRES_USER:     user
      POSTGRES_PASSWORD: ${CHAT_DB_PASSWORD:-secret}
    volumes:
      - pg_chat:/var/lib/postgresql
    networks:
      - sozvon-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d chatdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ════════════════════════════════════════════════════════════════════════════
  # Go-сервисы
  # ════════════════════════════════════════════════════════════════════════════

  voice-service:
    build:
      context: ./Services/Voice_Service
      dockerfile: Dockerfile
    container_name: voice-service
    restart: unless-stopped
    environment:
      # WebRTC STUN/TURN — переопределяется в .env при необходимости
      STUN_SERVERS: ${STUN_SERVERS:-stun:stun.sipnet.ru:3478}
      TURN_SERVER:  ${TURN_SERVER:-}
      TURN_USER:    ${TURN_USER:-}
      TURN_PASS:    ${TURN_PASS:-}
      PUBLIC_IP:    ${GLOBAL_IP:-}
      APP_PORT:     8085
      UDP_PORT_MIN: 10000
      UDP_PORT_MAX: 10200
    ports:
      - "10000-10200:10000-10200/udp"
    expose:
      - "8085"
    networks:
      - sozvon-net

  user-service:
    build:
      context: ./Services/User_Service
      dockerfile: Dockerfile
    container_name: user-service
    restart: unless-stopped
    environment:
      DB_HOST:     user-db
      DB_PORT:     5432
      DB_NAME:     userdb
      DB_USER:     user
      DB_PASSWORD: ${USER_DB_PASSWORD:-secret}
      APP_PORT:    8083
    expose:
      - "8083"
    depends_on:
      user-db:
        condition: service_healthy
    networks:
      - sozvon-net

  chat-service:
    build:
      context: ./Services/Chat_Service
      dockerfile: Dockerfile
    container_name: chat-service
    restart: unless-stopped
    environment:
      DB_HOST:     chat-db
      DB_PORT:     5432
      DB_NAME:     chatdb
      DB_USER:     user
      DB_PASSWORD: ${CHAT_DB_PASSWORD:-secret}
      APP_PORT:    8084
    expose:
      - "8084"
    depends_on:
      chat-db:
        condition: service_healthy
    networks:
      - sozvon-net

  auth-service:
    build:
      context: ./Services/Auth_Service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: unless-stopped
    environment:
      DB_HOST:     auth-db
      DB_PORT:     5432
      DB_NAME:     authdb
      DB_USER:     user
      DB_PASSWORD: ${AUTH_DB_PASSWORD:-secret}
      JWT_SECRET:  ${JWT_SECRET:-changeme}
      APP_PORT:    8082
    expose:
      - "8082"
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - sozvon-net
      
  gateway:
    build:
      context: ./Gateway
      dockerfile: Dockerfile
    container_name: gateway
    expose:
      - "8080"
    environment:
      SERVER_ADDRESS:    ":8080"
      AUTH_SERVICE_URL:  "http://auth-service:8082"
      USER_SERVICE_URL:  "http://user-service:8083"
      CHAT_SERVICE_URL:  "http://chat-service:8084"
      VOICE_SERVICE_URL: "http://voice-service:8085"
      JWT_SECRET_KEY:    ${JWT_SECRET}
    networks:
      - sozvon-net

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile.nginx
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /root/Sozvon/nginx/nginx-certs:/etc/nginx/certs:ro
    depends_on:
      - gateway
      - client
      - auth-service
      - user-service
      - chat-service
      - voice-service
    networks:
      - sozvon-net

  # ════════════════════════════════════════════════════════════════════════════
  # React-клиент (production build)
  # ════════════════════════════════════════════════════════════════════════════
  
  client:
    build:
      context: ./sozvon-client
      dockerfile: Dockerfile
    args:
      VITE_API_URL: https://zvonya.ru/api
      VITE_WS_URL: wss://zvonya.ru/ws
    container_name: sozvon-client
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - sozvon-net

